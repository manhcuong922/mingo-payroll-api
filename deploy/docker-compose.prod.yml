# ===== Mingo Payroll — Production stack =====
# Triển khai trên VPS tại /opt/mingo. Mọi secret nằm trong file .env (cùng thư mục, KHÔNG commit).
# Chỉ container caddy publish port ra ngoài; các service còn lại chỉ giao tiếp trong network nội bộ.

services:
  caddy:
    image: caddy:2-alpine
    container_name: mingo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN}
      KIOSK_DOMAIN: ${KIOSK_DOMAIN}
      AI_DOMAIN: ${AI_DOMAIN}
      # Dải IP được phép gọi AI service (cách nhau bằng dấu cách). Các endpoint
      # /process_frame, /extract_embedding, /reload_employees không có auth, nên đây
      # là lớp chặn duy nhất — để rỗng là chặn hết.
      AI_ALLOWED_IPS: ${AI_ALLOWED_IPS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - ui
      - minio
      - attendance-ai
      - attendance-ui
    networks:
      - mingo

  ui:
    image: ghcr.io/${REGISTRY_OWNER}/mingo-payroll-ui:${IMAGE_TAG:-latest}
    container_name: mingo-ui
    restart: unless-stopped
    networks:
      - mingo

  api:
    image: ghcr.io/${REGISTRY_OWNER}/mingo-payroll-api:${IMAGE_TAG:-latest}
    container_name: mingo-api
    restart: unless-stopped
    # Nạp toàn bộ biến cấu hình ứng dụng (Section__Key) từ .env
    env_file:
      - .env
    environment:
      # DEMO: mỗi lần api khởi động sẽ XÓA SẠCH DB rồi seed lại -> data luôn giống seeder sau mỗi deploy.
      # Mặc định TRUE ở stack demo này; tắt bằng cách đặt SEED_RESET_ON_STARTUP=false trong .env trên VPS.
      # ⚠️ Bật = mọi lần api restart (deploy/reboot/crash) đều mất toàn bộ dữ liệu,
      #    kể cả các đăng ký khuôn mặt đã duyệt -> AI service load 0 embedding.
      Seed__ResetOnStartup: ${SEED_RESET_ON_STARTUP:-true}
      # Mật khẩu seed cho tài khoản 'ai-service'. Khai báo ở đây (thay vì để trong
      # env_file) để nó và SERVICE_PASSWORD của attendance-ai luôn cùng một giá trị.
      AiServiceAccount__Password: ${AI_SERVICE_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_healthy
      llmproxy:
        condition: service_started
    networks:
      - mingo

  # AI nhận diện khuôn mặt (Flask, cổng 5002). Không publish port; ra ngoài qua Caddy
  # ({$AI_DOMAIN}) có gate IP, vào trong thì api gọi http://attendance-ai:5002.
  attendance-ai:
    image: ghcr.io/${REGISTRY_OWNER}/mingo-payroll-attendance-tracking:${IMAGE_TAG:-latest}
    container_name: mingo-attendance-ai
    restart: unless-stopped
    # Khai báo tường minh thay vì env_file: .env — tránh đẩy chuỗi kết nối DB,
    # secret MinIO/SMTP vào container này một cách không cần thiết.
    environment:
      TZ: Asia/Ho_Chi_Minh
      BACKEND_URL: http://api:8080
      MODEL_DIR: /app/models
      SERVICE_USERNAME: ${AI_SERVICE_USERNAME:-ai-service}
      SERVICE_PASSWORD: ${AI_SERVICE_PASSWORD}
      CAMERA_ID: ${AI_CAMERA_ID:-1}
      MATCH_THRESHOLD: ${AI_MATCH_THRESHOLD:-0.7}
      LIVENESS_THRESHOLD: ${AI_LIVENESS_THRESHOLD:-0.5}
      CHECKIN_COOLDOWN: ${AI_CHECKIN_COOLDOWN:-30}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
    volumes:
      # Model (~600MB) không nằm trong image; lần chạy đầu tải về đây rồi dùng lại
      # cho mọi lần deploy sau. Xoá volume này = phải tải lại từ đầu.
      - attendance-models:/app/models
      - attendance-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Lần boot đầu tải ~300MB model trước khi /health trả 200 — 60s của Dockerfile
      # là quá ngắn và container sẽ bị đánh dấu unhealthy oan.
      start_period: 300s
    depends_on:
      - api
    networks:
      - mingo

  # UI kiosk quét khuôn mặt. Bắt buộc phục vụ qua HTTPS ({$KIOSK_DOMAIN}) vì
  # getUserMedia chỉ chạy trên secure context.
  attendance-ui:
    image: ghcr.io/${REGISTRY_OWNER}/mingo-payroll-attendance-tracking-ui:${IMAGE_TAG:-latest}
    container_name: mingo-attendance-ui
    restart: unless-stopped
    depends_on:
      - attendance-ai
    networks:
      - mingo

  # Proxy LLM cho module Compliance — dùng OAuth Claude Pro (không tính tiền token).
  # KHÔNG publish port ra ngoài; chỉ "api" gọi nội bộ qua http://llmproxy:8317.
  # Token OAuth ở ./llmproxy/auths (mount /root/.cli-proxy-api) — KHÔNG commit.
  llmproxy:
    image: eceasy/cli-proxy-api:latest
    container_name: mingo-llmproxy
    restart: unless-stopped
    volumes:
      - ./llmproxy/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./llmproxy/auths:/root/.cli-proxy-api
      - ./llmproxy/logs:/CLIProxyAPI/logs
    networks:
      - mingo

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mingo-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Image mssql 2022 không kèm sqlcmd; kiểm tra cổng 1433 đã mở bằng bash TCP probe.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mingo

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: mingo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD --quiet && mc admin info local > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - mingo

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: mingo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_BACKEND_USER: ${MINIO_BACKEND_USER}
      MINIO_BACKEND_PASSWORD: ${MINIO_BACKEND_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
        (mc mb -p local/$$MINIO_BUCKET || true) &&
        mc anonymous set none local/$$MINIO_BUCKET &&
        printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\",\"s3:GetBucketLocation\",\"s3:GetObjectVersion\",\"s3:DeleteObjectVersion\",\"s3:GetBucketVersioning\",\"s3:PutBucketVersioning\"],\"Resource\":[\"arn:aws:s3:::%s\",\"arn:aws:s3:::%s/*\"]}]}' \"$$MINIO_BUCKET\" \"$$MINIO_BUCKET\" > /tmp/policy.json &&
        (mc admin user add local \"$$MINIO_BACKEND_USER\" \"$$MINIO_BACKEND_PASSWORD\" || true) &&
        (mc admin policy create local backend-rw /tmp/policy.json || true) &&
        (mc admin policy attach local backend-rw --user \"$$MINIO_BACKEND_USER\" || true) &&
        echo '=== MinIO bootstrap done ==='
      "
    restart: "no"
    networks:
      - mingo

networks:
  mingo:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  mssql-data:
  minio-data:
  attendance-models:
  attendance-logs:
