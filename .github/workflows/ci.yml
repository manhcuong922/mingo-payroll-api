name: CI

# Kiểm tra build/test trên mỗi Pull Request vào dev (nơi team mở PR và bạn review).
# Dùng làm required status check cho branch protection của nhánh dev.

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MPS.sln

      - name: Build
        run: dotnet build MPS.sln -c Release --no-restore

      - name: Test
        run: dotnet test MPS.sln -c Release --no-build --verbosity normal
