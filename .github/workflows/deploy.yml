name: Build & Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mingo-payroll-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Đồng bộ compose + Caddyfile + script lên VPS (KHÔNG đụng tới .env đã có sẵn).
      - name: Sync deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "/opt/mingo"
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mingo
            chmod +x deploy.sh
            ./deploy.sh

  # Gửi email báo cáo sau mỗi lần deploy (kể cả khi fail).
  notify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    steps:
      - name: Soạn nội dung báo cáo
        run: |
          STATUS='${{ needs.build-and-deploy.result }}'
          DEPLOY_TIME=$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S %z')
          # Lấy danh sách commit của lần push này từ payload sự kiện (mỗi commit: hash | tác giả | thời gian | tiêu đề)
          COMMITS=$(jq -r '.commits[]? | "- \(.id[0:7]) | \(.author.name) <\(.author.email)> | \(.timestamp) | \(.message | split("\n")[0])"' "$GITHUB_EVENT_PATH")
          [ -z "$COMMITS" ] && COMMITS="(không có commit mới trong lần push này — vd chạy thủ công)"
          {
            echo "Repo:        ${{ github.repository }}"
            echo "Trạng thái:  $STATUS"
            echo "Thời gian:   $DEPLOY_TIME"
            echo "Người push:  ${{ github.actor }}"
            echo "Phạm vi:     ${{ github.event.before }} -> ${{ github.sha }}"
            echo "Chi tiết:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Các commit đã thêm sau lần deploy trước:"
            echo "$COMMITS"
          } > report.txt
          cat report.txt

      - name: Gửi email thông báo
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Deploy ${{ needs.build-and-deploy.result }}] ${{ github.repository }} @ ${{ github.sha }}"
          to: ${{ vars.DEPLOY_NOTIFY_EMAILS }}
          from: Mingo Payroll CI <${{ secrets.MAIL_USERNAME }}>
          body: file://report.txt
